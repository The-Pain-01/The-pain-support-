<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☠️ UNBAN SUPPORT ☠️</title>


<link rel="stylesheet" href="style.css">

<link rel="icon" href="assets/favicon.ico">

</head>


<body>



<video autoplay muted loop playsinline preload="auto" id="background-video">

<source src="https://files.catbox.moe/4d9eh3.mp4" type="video/mp4">

</video>




<div class="overlay"></div>





<div class="page">



<header>


<h1 class="title">

☠️ THE PAIN SUPPORT ☠️

</h1>


</header>






<main>


<div class="button-container">





<h2 class="form-title">

UNBAN SUPPORT

</h2>







<input

class="support-input"

id="unban-number"

type="text"

placeholder="Enter the banned number"

oninput="updateMessage('unban')"

>







<div class="reason-box">


<button class="main-btn" onclick="toggleReason('script-list')">

Script ▼

</button>





<div id="script-list" class="reason-list">


<p onclick="selectReason('Script 1','unban')">

Script 1

</p>



<p onclick="selectReason('Script 2','unban')">

Script 2

</p>



<p onclick="selectReason('Script 3','unban')">

Script 3

</p>



<p onclick="selectReason('Script 4','unban')">

Script 4

</p>



<p onclick="selectReason('Script 5','unban')">

Script 5

</p>



</div>



</div>







<p id="selected-reason">

No script selected

</p>







<textarea

class="support-input textarea"

id="unban-message"

placeholder="Message"

></textarea>








<button class="main-btn" onclick="sendEmail('unban')">

SEND REQUEST

</button>







</div>



</main>







<footer>

POWERED BY THE PAIN TDL

</footer>





</div>







<script src="config.js"></script>

<script src="message.js"></script>

<script src="script.js"></script>



</body>

</html>
