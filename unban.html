<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNBAN SUPPORT - THE PAIN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>☠️ UNBAN SUPPORT ☠️</h1>

    <p>
        Fais une demande de récupération pour ton compte WhatsApp.
    </p>

    <input type="text" id="number" placeholder="Numéro WhatsApp (+243...)">

    <select id="reason">
        <option value="Compte bloqué par erreur">Compte bloqué par erreur</option>
        <option value="Compte récupéré">Compte récupéré</option>
        <option value="Demande de réactivation">Demande de réactivation</option>
    </select>

    <button onclick="sendUnban()">
        ENVOYER AU SUPPORT
    </button>

    <a href="home.html">
        ⬅ Retour
    </a>

</div>


<script>

function sendUnban(){

    let number = document.getElementById("number").value;
    let reason = document.getElementById("reason").value;

    if(!number){
        alert("Entre ton numéro WhatsApp");
        return;
    }


    let message = `Bonjour WhatsApp Support,

Je souhaite demander la réactivation de mon compte WhatsApp.

Numéro concerné : ${number}

Motif : ${reason}

Je vous prie de bien vouloir vérifier mon compte et m'aider à le récupérer.

Merci.`;

    let subject = "Demande de récupération d'un compte WhatsApp";

    window.location.href =
    "mailto:support@whatsapp.com?subject="
    + encodeURIComponent(subject)
    + "&body="
    + encodeURIComponent(message);

}

</script>

</body>
</html>
