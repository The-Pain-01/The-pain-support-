<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☠️ UNBAN SUPPORT ☠️</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="assets/favicon.ico">

</head>


<body>


<video autoplay muted loop playsinline preload="auto" id="background-video">

<source src="https://files.catbox.moe/4d9eh3.mp4" type="video/mp4">

</video>



<div class="overlay"></div>





<div class="page">



<header>

<h1 class="title">

☠️ THE PAIN SUPPORT ☠️

</h1>

</header>







<main>


<div class="button-container">





<h2 class="form-title">

UNBAN SUPPORT

</h2>







<input

class="support-input"

id="unban-number"

type="text"

placeholder="+243XXXXXXXXX"

oninput="updateMessage('unban')"

>








<div class="reason-box">


<button class="main-btn" onclick="toggleReason('suspension-list')">

Type of suspension ▼

</button>






<div id="suspension-list" class="reason-list">



<p onclick="selectSuspension('Misuse of WhatsApp')">

Misuse of WhatsApp

</p>




<p onclick="selectSuspension('Suspicious Activity')">

Suspicious Activity

</p>





<p onclick="selectSuspension('Spam Suspension')">

Spam Suspension

</p>





<p onclick="selectSuspension('Account Hacked')">

Account Hacked

</p>





<p onclick="selectSuspension('Other')">

Other

</p>





</div>


</div>









<div class="reason-box" id="unban-script-container" style="display:none;">



<button class="main-btn" onclick="toggleReason('unban-script-list')">

Script ▼

</button>






<div id="unban-script-list" class="reason-list">



<p onclick="selectUnbanScript('Script 1')">

Script 1

</p>




<p onclick="selectUnbanScript('Script 2')">

Script 2

</p>




<p onclick="selectUnbanScript('Script 3')">

Script 3

</p>




<p onclick="selectUnbanScript('Script 4')">

Script 4

</p>




<p onclick="selectUnbanScript('Script 5')">

Script 5

</p>




</div>


</div>








<p id="selected-reason">

No suspension selected

</p>







<textarea

class="support-input textarea"

id="unban-message"

placeholder="Message">

</textarea>








<button class="main-btn" onclick="sendEmail('unban')">

SEND REQUEST

</button>








<a href="index.html" class="main-btn">

BACK

</a>






</div>


</main>







<footer>

POWERED BY THE PAIN TDL

</footer>







</div>








<script src="config.js"></script>

<script src="message.js"></script>

<script src="script.js"></script>



</body>

</html>
