<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☠️ THE PAIN SUPPORT ☠️</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="assets/favicon.ico">

</head>

<body>

<video autoplay muted loop playsinline preload="auto" id="background-video">

<source src="assets/bg.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<div class="page">

<header>

<h1 class="title">

☠️ THE PAIN SUPPORT ☠️

</h1>

</header>

<main>

<div class="button-container">

<input
id="password"
class="support-input"
type="password"
placeholder="PASSWORD"
autocomplete="off"
>

<button class="main-btn" onclick="checkPassword()">

🔓 CHECK ACCESS 🔓

</button>

<p id="access-message"></p>

</div>

</main>

<footer>

POWERED BY THE PAIN TDL

</footer>

</div>

<script src="password.js"></script>

<script>

function checkPassword(){

const input=document.getElementById("password");
const message=document.getElementById("access-message");

if(input.value===SITE_PASSWORD){

message.style.color="#4dff88";
message.innerHTML="✅ Access Granted - Welcome to THE PAIN SUPPORT";
message.classList.remove("shake");

setTimeout(()=>{

window.location.href="home.html";

},1000);

}else{

message.style.color="#ff3d3d";
message.innerHTML="❌ Wrong Password - Access Denied";

input.classList.add("shake");

input.value="";

setTimeout(()=>{

input.classList.remove("shake");

},500);

}

}

</script>

</body>

</html>
