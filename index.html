<main class="container">


<section id="ban-section" class="panel">


<h2>
    BAN SUPPORT
</h2>



<input 
id="ban-number"
type="text"
placeholder="Enter WhatsApp number">





<div class="dropdown">


<button onclick="toggleReason('ban-reasons')">

Reason ▼

</button>



<div id="ban-reasons" class="dropdown-content">


<p onclick="selectReason('Spam')">
Spam
</p>

</p>


<p onclick="selectReason('Illegal Content')">

</p>


<p onclick="selectReason('Impersonation')">
Impersonation
</p>


<p onclick="selectReason('Other')">
Other
</p>


</div>


</div>



<p id="selected-reason">
No reason selected
</p>




<textarea
id="ban-message"
placeholder="Write your message...">
</textarea>




<button class="send-btn" onclick="sendEmail('ban')">

OPEN EMAIL

</button>




<a href="home.html">

<button class="back-btn">

BACK

</button>

</a>



</section>








<section id="unban-section" class="panel">


<h2>
ACCOUNT REVIEW
</h2>



<input

id="unban-number"

type="text"

placeholder="Enter WhatsApp number">





<textarea

id="unban-message"

placeholder="Write your review request...">

</textarea>




<button class="send-btn" onclick="sendEmail('unban')">

OPEN EMAIL

</button>

<button class="back-btn">

BACK

</button>

</a>
