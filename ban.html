<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☠️ BAN SUPPORT ☠️</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="assets/favicon.ico">

</head>


<body>


<video autoplay muted loop playsinline preload="auto" id="background-video">

<source src="https://files.catbox.moe/4d9eh3.mp4" type="video/mp4">

</video>



<div class="overlay"></div>




<div class="page">



<header>

<h1 class="title">

☠️ THE PAIN SUPPORT ☠️

</h1>

</header>






<main>


<div class="button-container">



<h2 class="form-title">

BAN SUPPORT

</h2>





<input

class="support-input"

id="ban-number"

type="text"

placeholder="Enter the number to ban"

oninput="updateMessage('ban')"

>






<div class="reason-box">


<button class="main-btn" onclick="toggleReason('ban-reasons')">

Reason ▼

</button>




<div id="ban-reasons" class="reason-list">


<p onclick="selectReason('Spam','ban')">

Spam

</p>



<p onclick="selectReason('Scam','ban')">

Scam

</p>



<p onclick="selectReason('Illegal Content','ban')">

Illegal Content

</p>



<p onclick="selectReason('Child Safety','ban')">

Child Safety

</p>



<p onclick="selectReason('Impersonation','ban')">

Impersonation

</p>



<p onclick="selectReason('Other','ban')">

Other

</p>


</div>


</div>






<p id="selected-reason">

No reason selected

</p>







<textarea

class="support-input textarea"

id="ban-message"

placeholder="Message"

></textarea>







<button class="main-btn" onclick="sendEmail('ban')">

SEND REPORT

</button>




</div>


</main>






<footer>

POWERED BY THE PAIN TDL

</footer>




</div>





<script src="config.js"></script>

<script src="message.js"></script>

<script src="script.js"></script>


</body>

</html>
