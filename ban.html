<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 BAN SUPPORT 🔥</title>


<link rel="stylesheet" href="style.css">

<link rel="icon" href="assets/favicon.ico">


</head>


<body onload="checkAccess()">



<video autoplay muted loop playsinline id="background-video">

<source src="assets/bg.mp4" type="video/mp4">

</video>



<div class="overlay"></div>





<div class="page">





<header>


<h1 class="title">

☠️ THE PAIN SUPPORT ☠️

</h1>


</header>







<main>



<div class="button-container">






<h2 class="form-title">

🔥 BAN SUPPORT 🔥

</h2>







<input

class="support-input"

id="ban-number"

type="text"

placeholder="+243XXXXXXXXX"

>







<button class="main-btn" onclick="toggleReason('ban-reasons')">

📌 REASON 📌

</button>







<div id="ban-reasons" class="reason-list">



<p onclick="selectReason('Spam')">

Spam

</p>



<p onclick="selectReason('Scam')">

Scam

</p>



<p onclick="selectReason('Illegal Content')">

Illegal Content

</p>



<p onclick="selectReason('Child Safety')">

Child Safety

</p>



<p onclick="selectReason('Impersonation')">

Impersonation

</p>



<p onclick="selectReason('Other')">

Other

</p>



</div>








<button id="script-button" class="main-btn" onclick="toggleReason('ban-scripts')" style="display:none;">

📜 SCRIPT 📜

</button>
<div id="ban-scripts" class="reason-list">


<p onclick="selectScript('Script 1')">

Script 1

</p>



<p onclick="selectScript('Script 2')">

Script 2

</p>



<p onclick="selectScript('Script 3')">

Script 3

</p>



<p onclick="selectScript('Script 4')">

Script 4

</p>



<p onclick="selectScript('Script 5')">

Script 5

</p>



</div>







<p id="selected-reason">

No reason selected

</p>







<textarea

class="support-input textarea"

id="ban-message"

placeholder="Message">

</textarea>








<button class="main-btn" onclick="sendEmail('ban')">

🔥 SEND REPORT 🔥

</button>








<a href="home.html" class="main-btn">

⬅️ BACK ⬅️

</a>







</div>



</main>








<footer>

POWERED BY THE PAIN TDL

</footer>






</div>







<script src="config.js"></script>

<script src="message.js"></script>

<script src="script.js"></script>



</body>


</html>
